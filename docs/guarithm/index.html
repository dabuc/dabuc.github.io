<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>六爻排盘系统</title>
  <script type="module" crossorigin src="/assets/guarithm-lqQrf8Cf.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="stylesheet" crossorigin href="/assets/guarithm-FvEuAxHW.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>六爻排盘系统</h1>
            <p>输入卦象信息，自动排盘</p>
        </header>

        <div class="form-card">
            <div class="form-row">
                <div class="form-group">
                    <label for="monthZhi">月支</label>
                    <select id="monthZhi">
                        <option value="子">子月</option>
                        <option value="丑">丑月</option>
                        <option value="寅">寅月</option>
                        <option value="卯">卯月</option>
                        <option value="辰">辰月</option>
                        <option value="巳">巳月</option>
                        <option value="午">午月</option>
                        <option value="未">未月</option>
                        <option value="申">申月</option>
                        <option value="酉">酉月</option>
                        <option value="戌">戌月</option>
                        <option value="亥">亥月</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="dayGan">日干</label>
                    <select id="dayGan">
                        <option value="甲">甲</option>
                        <option value="乙">乙</option>
                        <option value="丙">丙</option>
                        <option value="丁">丁</option>
                        <option value="戊">戊</option>
                        <option value="己">己</option>
                        <option value="庚">庚</option>
                        <option value="辛">辛</option>
                        <option value="壬">壬</option>
                        <option value="癸">癸</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="dayZhi">日支</label>
                    <select id="dayZhi">
                        <option value="子">子</option>
                        <option value="丑">丑</option>
                        <option value="寅">寅</option>
                        <option value="卯">卯</option>
                        <option value="辰">辰</option>
                        <option value="巳">巳</option>
                        <option value="午">午</option>
                        <option value="未">未</option>
                        <option value="戌">戌</option>
                        <option value="亥">亥</option>
                    </select>
                </div>
            </div>

            <div class="form-group full-width">
                <label for="digits">卦数（6位数字，每位为6-9）</label>
                <input type="text" id="digits" placeholder="例如：777888" maxlength="6" pattern="[6-9]{6}">
                <div class="hint">6=老阴(动) 7=少阳(静) 8=少阴(静) 9=老阳(动)</div>
            </div>

            <div class="button-group">
                <button id="calculateBtn" class="btn btn-primary">排盘</button>
                <button id="copyBtn" class="btn btn-secondary" disabled>复制</button>
                <button id="resetBtn" class="btn btn-outline">重置</button>
            </div>
        </div>

        <div id="resultContainer" class="result-container" style="display: none;">
            <div class="result-header">
                <h2>排盘结果</h2>
            </div>
            <div id="resultContent" class="result-content"></div>
        </div>
    </div>

</body>
</html>
